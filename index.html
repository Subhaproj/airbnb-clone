<!doctype html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/airbnb-clone/my-logo.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>airbnb-clone</title>

    <script>
      const redirect = sessionStorage.redirect;

      delete sessionStorage.redirect;

      if (
        redirect &&
        redirect !== window.location.pathname
      ) {
        history.replaceState(
          null,
          null,
          redirect
        );
      }
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>

</html>
